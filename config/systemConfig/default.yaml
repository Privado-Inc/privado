systemConfig:
  - key: maxSocketCount
    value: "4096"

  - key: RepoPropertyConfig
    value: "(?i).*(prod|production|release).*((db|data_?base|data_?source).?(host|name|url|type)|s3.?bucket)"

  - key: propertyFileSizeLimit
    value: "5"

  - key: propertyFileDirCountLimit
    value: "10"

  - key: maxCharLimit
    value: "1000"

  - key: muleStructuralModules
    value: "^(core|documentation|mule-apikit|secure-properties|munit|munit-tools|spring|tls|api-gateway)$"

  - key: muleStructuralSinkElements
    value: "^(logger)$"

  - key: muleEventSourceElements
    value: "^(listener|scheduler)$"
