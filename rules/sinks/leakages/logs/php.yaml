sinks:
  - id: Leakages.Log.Critical
    name: Log Critical
    patterns:
      - "(?i).*(?:log|logger)->.*(?:emergency|alert|critical).*"
    tags:

  - id: Leakages.Log.Critical
    name: Log Critical
    filterProperty: "code"
