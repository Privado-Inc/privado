# MuleSoft: messaging connectors, email, and the catch-all for connectors no other rule names.
#
# Keep the catch-all's negative lookahead in step with every module that has its own rule (here, in
# amazonaws/, salesforce/, storages/, leakages/). Otherwise a connector is reported twice.

muleSinks:

  - id: Messaging.Service.Mulesoft.VM
    name: Mulesoft VM Queue
    domains:
      - "mulesoft.com"
    patterns:
      - "(?i)^mule\\.vm\\.(publish|publish-consume)$"
    tags:

  - id: Messaging.Service.Mulesoft.AnypointMQ
    name: Mulesoft Anypoint MQ
    domains:
      - "mulesoft.com"
    patterns:
      - "(?i)^mule\\.anypoint-mq\\.(publish|publish-consume)$"
    tags:

  - id: Messaging.Service.JMS.Producer
    name: JMS Producer
    patterns:
      - "(?i)^mule\\.jms\\.(publish|publish-consume)$"
    tags:

  - id: Messaging.Queue.Kafka.Producer
    name: Kafka Producer
    domains:
      - "kafka.apache.org"
    patterns:
      - "(?i)^mule\\.kafka\\.(publish|batch-publish)$"
    tags:

  - id: ThirdParties.SDK.Mulesoft.Email
    name: Mulesoft Email Connector
    patterns:
      - "(?i)^mule\\.email\\.send$"
    tags:

  # Notifications to Anypoint Runtime Manager; the message and custom properties carry the data.
  - id: ThirdParties.SDK.Mulesoft.CloudHub
    name: Mulesoft CloudHub Notifications
    domains:
      - "anypoint.mulesoft.com"
    patterns:
      - "(?i)^mule\\.cloudhub\\.create-notification$"
    tags:

  # Any other Anypoint connector operation. The implementation lives in another artifact, so privado cannot say
  # where the data goes, but the egress must not be dropped. Excludes every module that has a dedicated rule above
  # or under storages/ and leakages/, plus parameter-style modules that never carry data out on their own.
  - id: ThirdParties.SDK.Mulesoft
    name: Mulesoft Connector
    domains:
      - "mulesoft.com"
    patterns:
      - "(?i)^mule\\.(?!(http|wsc|db|s3|sqs|sns|dynamodb|lambda|salesforce|salesforce-[a-z0-9-]+|sfdc-[a-z0-9-]+|vm|anypoint-mq|jms|kafka|email|cloudhub|os|file|ftp|sftp|mongo|redis|logger)\\.)[a-z0-9_-]+\\..*"
    tags:
