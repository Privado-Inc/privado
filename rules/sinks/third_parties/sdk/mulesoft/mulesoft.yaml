# MuleSoft: messaging connectors, email and CloudHub notifications.

sinks:

  - id: Messaging.Service.Mulesoft.VM
    name: Mulesoft VM Queue
    domains:
      - "mulesoft.com"
    patterns:
      - "(?i)^mule\\.vm\\.(publish|publish-consume)$"
    tags:

  - id: Messaging.Service.Mulesoft.AnypointMQ
    name: Mulesoft Anypoint MQ
    domains:
      - "mulesoft.com"
    patterns:
      - "(?i)^mule\\.anypoint-mq\\.(publish|publish-consume)$"
    tags:

  - id: Messaging.Service.JMS.Producer
    name: JMS Producer
    patterns:
      - "(?i)^mule\\.jms\\.(publish|publish-consume)$"
    tags:

  - id: Messaging.Queue.Kafka.Producer
    name: Kafka Producer
    domains:
      - "kafka.apache.org"
    patterns:
      - "(?i)^mule\\.kafka\\.(publish|batch-publish)$"
    tags:

  - id: ThirdParties.SDK.Mulesoft.Email
    name: Mulesoft Email Connector
    patterns:
      - "(?i)^mule\\.email\\.send$"
    tags:

  # Notifications to Anypoint Runtime Manager; the message and custom properties carry the data.
  - id: ThirdParties.SDK.Mulesoft.CloudHub
    name: Mulesoft CloudHub Notifications
    domains:
      - "anypoint.mulesoft.com"
    patterns:
      - "(?i)^mule\\.cloudhub\\.create-notification$"
    tags:
