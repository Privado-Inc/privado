# MuleSoft event sources. A flow whose first element is one of these is a collection point; the endpoint
# (basePath + path for HTTP, the queue/topic name otherwise) is attached by privado-core.
# APIkit-generated route flows are identified as mule.apikit.<method> and get their own collection id.

muleCollections:

  - id: Collections.Mulesoft.HttpListener
    name: Mulesoft HTTP Listener
    patterns:
      - "(?i)^mule\\.https?\\.listener$"
    tags:

  # A route flow generated by APIkit (`<verb>:\<resource>:<config>`): the endpoint is the RAML resource path.
  - id: Collections.Mulesoft.APIkit
    name: Mulesoft APIkit Route
    patterns:
      - "(?i)^mule\\.apikit\\.(get|post|put|patch|delete|head|options)$"
    tags:

  - id: Collections.Mulesoft.QueueListener
    name: Mulesoft Queue Listener
    patterns:
      - "(?i)^mule\\.(vm|jms|sqs|anypoint-mq|kafka)\\.listener$"
    tags:
